name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ecs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, intl, mbstring, openssl, pdo, zip
      # Resolve dependencies for this job's PHP, not the local platform pin.
      - run: composer config --unset platform.php
      - run: composer install --no-interaction --no-progress
      - run: composer check-cs

  phpstan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, intl, mbstring, openssl, pdo, zip
      # Resolve dependencies for this job's PHP, not the local platform pin.
      - run: composer config --unset platform.php
      - run: composer install --no-interaction --no-progress
      - run: composer phpstan

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # Must contain "test": the integration harness drops every table in it
          # on each run and refuses database names that don't announce that.
          MYSQL_DATABASE: dash_dam_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CRAFT_DB_DRIVER: mysql
      CRAFT_DB_SERVER: 127.0.0.1
      CRAFT_DB_PORT: '3306'
      CRAFT_DB_DATABASE: dash_dam_test
      CRAFT_DB_USER: root
      CRAFT_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, mbstring, openssl, pdo, pdo_mysql, zip
      - run: composer config --unset platform.php
      - run: composer install --no-interaction --no-progress
      - run: composer test
